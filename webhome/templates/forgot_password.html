{% extends 'base.html' %}

{% block content %}

<div class="login-container">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address.
        We will send you a temporary password.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <button type="submit">
            Send Temporary Password
        </button>

    </form>

    <br>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</div>

{% endblock %}
