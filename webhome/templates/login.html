{% extends 'base.html' %}
{% load static %}
{% block title %} SCOPE INDIA - Login Page {% endblock %}

{% block content %}

    <div class="login_container">

        <h2>Student Login</h2>
        <form method="POST">
            {% csrf_token %}

            <div>
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div>
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div>
                <label>
                    <input type="checkbox" name="remember_me">
                    Keep me logged in
                </label>
            </div>
            
            <button type="submit">Login</button>
        </form>

        <p>
            First time login?
            <a href="{% url 'generate_password' %}">
                Generate Password
            </a>
        </p>
        <p>
            <a href="{% url 'forgot_password' %}">Forgot password?</a>
        </p>
    </div>


{% endblock %}
